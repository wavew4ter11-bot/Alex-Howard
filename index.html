<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050b18">
<title>A.L.E.X | Howard Core</title>
<style>
:root {
  --bg:#050b18; --panel:#0a172b; --blue:#00c8ff;
  --bright:#8beeff; --muted:#819bb8; --border:#00c8ff40;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;
  background:radial-gradient(ellipse at 50% 15%,#102b4a,var(--bg) 65%);
  color:#eaf9ff;font-family:"Segoe UI",Arial,sans-serif
}
button,input,select{font:inherit}
button{
  color:var(--bright);background:#00c8ff0d;border:1px solid var(--border);
  border-radius:11px;padding:11px 13px;cursor:pointer;transition:.18s
}
button:hover{background:#00c8ff20;border-color:var(--blue)}
button:disabled{opacity:.5;cursor:wait}
input,select{
  width:100%;padding:13px;color:white;background:#040c19;
  border:1px solid var(--border);border-radius:10px;outline:none
}
select option{background:#071426;color:white}
input:focus,select:focus{border-color:var(--blue)}
header{
  min-height:64px;padding:0 20px;display:flex;align-items:center;
  justify-content:space-between;border-bottom:1px solid var(--border);
  background:#030916bb
}
.brand{font-weight:700;letter-spacing:.2em}
.brand span,h1 span{color:var(--blue)}
#screen{min-height:calc(100vh - 64px)}
.center{width:min(100% - 30px,520px);margin:auto;padding:35px 0}
.intro{text-align:center}
.eyebrow{font-size:.72rem;color:var(--blue);letter-spacing:.22em;text-transform:uppercase}
.muted{color:var(--muted);font-size:.88rem}
.orb{
  position:relative;width:145px;height:145px;border:2px solid var(--blue);
  border-radius:50%;display:grid;place-items:center;margin:0 auto 24px;
  background:radial-gradient(circle,#155078,#07172d 58%,#050b18 75%);
  box-shadow:0 0 28px #00bfff44,inset 0 0 25px #00bfff44;
  animation:pulse 4s ease-in-out infinite
}
.orb:before,.orb:after{
  content:"";position:absolute;inset:-10px;border:1px solid #00c8ff88;
  border-radius:50%;transform:rotateX(65deg)
}
.orb:after{inset:-18px;transform:rotateY(65deg);border-color:#8beeff55}
.orb span{font-size:1.7rem;letter-spacing:.12em;color:#b9f7ff;text-shadow:0 0 15px var(--blue)}
@keyframes pulse{50%{box-shadow:0 0 40px #00bfff88,inset 0 0 35px #00bfff66}}
h1{font-size:clamp(1.8rem,5vw,2.5rem);margin:10px 0}
.card{
  margin-top:26px;padding:20px;border:1px solid var(--border);
  border-radius:17px;background:linear-gradient(145deg,#0c1c32ed,#071020ed)
}
.account-list,.stack{display:grid;gap:11px;margin-top:17px}
.account{width:100%;display:flex;align-items:center;justify-content:space-between;text-align:left}
.account strong{display:block;color:#effaff}
.account small{display:block;color:var(--muted);margin-top:4px}
.account .arrow{color:var(--blue);font-size:1.3rem}
.user-account{border-style:dashed}
.stack button{width:100%}
.notice{min-height:20px;margin-top:12px;color:var(--bright);font-size:.88rem;overflow-wrap:anywhere}
footer{text-align:center;color:#526b88;font-size:.75rem;padding:20px}
#hud{
  height:calc(100dvh - 64px);min-height:450px;
  display:grid;grid-template-columns:235px minmax(0,1fr)
}
.sidebar{
  padding:20px 14px;border-right:1px solid var(--border);
  background:#040c19cc;overflow-y:auto
}
.sidebar button{display:block;width:100%;text-align:left;margin-top:10px}
.main-chat{min-width:0;display:flex;flex-direction:column}
.hud-top{
  padding:13px 18px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap
}
.status{font-size:.78rem;color:var(--blue)}
.messages{
  flex:1;overflow-y:auto;padding:22px clamp(12px,4vw,40px);
  display:flex;flex-direction:column;gap:14px
}
.message{
  max-width:min(780px,95%);padding:14px 16px;border:1px solid var(--border);
  border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6
}
.message.ai{align-self:flex-start;background:#0b1b30}
.message.me{align-self:flex-end;background:#06334b;border-color:#008dc0}
.composer{
  display:flex;gap:9px;padding:13px clamp(10px,3vw,25px) max(13px,env(safe-area-inset-bottom));border-top:1px solid var(--border)
}
.composer input{min-width:0;flex:1}
.composer button{min-width:75px}
#mic-toggle{min-width:52px;padding:10px 12px}
#mic-toggle.listening{background:#00c8ff30;border-color:var(--blue);box-shadow:0 0 16px #00c8ff55}
#mic-toggle:disabled{opacity:.45}
.voice-hint{font-size:.75rem;color:var(--muted);padding:0 16px 8px}
.voice-controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.voice-controls select{width:auto;max-width:190px;padding:9px;font-size:.8rem}
.voice-controls button{padding:9px 11px;font-size:.8rem}
.mobile-only{display:none}
@media(max-width:700px){
  header{padding:0 13px}
  #hud{grid-template-columns:1fr}
  .sidebar{display:none}
  .mobile-only{display:inline-block}
  .hud-top{padding:12px}
  .messages{padding:15px 10px}
  .voice-controls{width:100%}
  .voice-controls select{flex:1;min-width:0;max-width:none}
  .composer{gap:6px}
  .composer button{min-width:60px;padding:10px}
}
@media(max-height:600px) and (orientation:landscape){
  .center{padding-top:15px}
  .orb{width:90px;height:90px;margin-bottom:15px}
}
</style>
</head>
<body>
<header>
  <div class="brand">HOWARD <span>CORE</span></div>
  <div id="header-status" class="muted">A.L.E.X SYSTEM</div>
</header>
<div id="screen"></div>

<script>
"use strict";

/* ===== CONFIGURATION ===== */

// Optional: paste your Gemini key between the quotation marks.
// WARNING: A key in a public GitHub repository is visible to everyone.
let GEMINI_API_KEY = "AQ.Ab8RN6Keag5PWUIcd_KmdPxXx4TDLzgz7tiI2FhzvCs5W_0bQw";
const GEMINI_MODEL = "gemini-3.8-flash";

const OWNER = {name:"Billy", pin:"112411"};
const REGISTRATION_CODE = "1124";
const STORAGE_KEY = "howardAlexAccountsV1";

let accounts = loadAccounts();
let activeAccount = null;
let chatHistory = [];
let busy = false;
let speechEnabled = true;
let availableVoices = [];
let selectedVoiceURI = "";
let speechGeneration = 0;
let voiceMode = false;
let recognition = null;
let recognitionSupported = false;
let alexSpeaking = false;
let restartRecognitionTimer = null;

const SPEECH_PREF_KEY = "howardAlexSpeechPrefsV1";

/* ===== ACCOUNT STORAGE ===== */

function loadAccounts(){
  try{
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if(Array.isArray(saved)){
      return saved.filter(a =>
        a && typeof a.name==="string" &&
        typeof a.pin==="string" &&
        !["billy","user"].includes(a.name.toLowerCase())
      );
    }
  }catch(e){}
  return [];
}

function saveAccounts(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(accounts));
}

function loadSpeechPrefs(){
  try{
    const p=JSON.parse(localStorage.getItem(SPEECH_PREF_KEY)||"{}");
    speechEnabled=p.enabled!==false;
    selectedVoiceURI=typeof p.voice==="string"?p.voice:"";
  }catch(e){}
}

function saveSpeechPrefs(){
  try{
    localStorage.setItem(SPEECH_PREF_KEY,JSON.stringify({
      enabled:speechEnabled,
      voice:selectedVoiceURI
    }));
  }catch(e){}
}

function escapeHTML(s){
  return String(s).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}

function setHeader(s){
  document.getElementById("header-status").textContent=s;
}

function intro(){
  return `<div class="intro">
    <div class="orb"><span>A.L.E.X</span></div>
    <div class="eyebrow">Howard Core Intelligence</div>
    <h1>Meet <span>A.L.E.X</span></h1>
    <p class="muted">Adaptive Logic &amp; Executive eXecution</p>
  </div>`;
}

/* ===== VOICE ENGINE ===== */

function getSpeechEngine(){
  return "speechSynthesis" in window &&
         "SpeechSynthesisUtterance" in window;
}

function refreshVoices(){
  if(!getSpeechEngine())return;
  availableVoices=window.speechSynthesis.getVoices()||[];
  updateVoiceSelectors();
}

function preferredVoice(){
  let voice=availableVoices.find(v=>v.voiceURI===selectedVoiceURI);
  if(voice)return voice;

  // Prefer British English voices, then other English voices.
  voice=availableVoices.find(v=>/^en-GB/i.test(v.lang)&&/female|serena|kate|hazel|susan|libby|sonia|female/i.test(v.name));
  if(voice)return voice;

  voice=availableVoices.find(v=>/^en-GB/i.test(v.lang));
  if(voice)return voice;

  voice=availableVoices.find(v=>/^en/i.test(v.lang));
  return voice||availableVoices[0]||null;
}

function updateVoiceSelectors(){
  const selector=document.getElementById("voice-select");
  if(!selector)return;

  if(!getSpeechEngine()){
    selector.innerHTML='<option value="">Speech unavailable</option>';
    selector.disabled=true;
    return;
  }

  const oldValue=selectedVoiceURI;
  selector.innerHTML="";

  if(!availableVoices.length){
    selector.innerHTML='<option value="">Loading device voices…</option>';
    return;
  }

  availableVoices.forEach(v=>{
    const option=document.createElement("option");
    option.value=v.voiceURI;
    option.textContent=`${v.name} (${v.lang})`;
    selector.appendChild(option);
  });

  const best=preferredVoice();
  const chosen=availableVoices.find(v=>v.voiceURI===oldValue)||best;
  if(chosen){
    selector.value=chosen.voiceURI;
    selectedVoiceURI=chosen.voiceURI;
  }
}

function stopSpeaking(){
  speechGeneration++;
  alexSpeaking=false;
  if(getSpeechEngine())window.speechSynthesis.cancel();
}

function speakText(text){
  if(!speechEnabled||!getSpeechEngine()||!text){
    alexSpeaking=false;
    if(voiceMode)queueListeningRestart();
    return;
  }

  stopListening();
  stopSpeaking();
  const generation=speechGeneration;
  const utterance=new SpeechSynthesisUtterance(String(text));
  const voice=preferredVoice();

  if(voice){
    utterance.voice=voice;
    utterance.lang=voice.lang||"en-GB";
  }else{
    utterance.lang="en-GB";
  }

  utterance.rate=0.94;
  utterance.pitch=0.96;
  utterance.volume=1;

  utterance.onstart=()=>{
    if(generation!==speechGeneration)return;
    alexSpeaking=true;
    const status=document.getElementById("voice-status");
    if(status)status.textContent="SPEAKING";
  };
  utterance.onend=()=>{
    if(generation!==speechGeneration)return;
    alexSpeaking=false;
    const status=document.getElementById("voice-status");
    if(status)status.textContent=voiceMode?"LISTENING FOR YOU":(speechEnabled?"VOICE ON":"VOICE OFF");
    if(voiceMode)queueListeningRestart();
  };
  utterance.onerror=()=>{
    if(generation!==speechGeneration)return;
    alexSpeaking=false;
    const status=document.getElementById("voice-status");
    if(status)status.textContent=voiceMode?"RESTARTING LISTENING":"VOICE READY";
    if(voiceMode)queueListeningRestart();
  };

  alexSpeaking=true;
  window.speechSynthesis.speak(utterance);
}

function toggleSpeech(){
  speechEnabled=!speechEnabled;
  if(!speechEnabled)stopSpeaking();
  saveSpeechPrefs();
  updateVoiceControls();
}

function updateVoiceControls(){
  const toggle=document.getElementById("voice-toggle");
  const status=document.getElementById("voice-status");
  if(toggle)toggle.textContent=speechEnabled?"Voice: ON":"Voice: OFF";
  if(status)status.textContent=speechEnabled?"VOICE ON":"VOICE OFF";
}

function buildVoiceControls(){
  return `<div class="voice-controls">
    <select id="voice-select" aria-label="Choose A.L.E.X voice">
      <option value="">Loading voices…</option>
    </select>
    <button type="button" id="voice-toggle">Voice: ON</button>
    <button type="button" id="stop-speaking">Stop</button>
  </div>`;
}

function attachVoiceControls(){
  const selector=document.getElementById("voice-select");
  const toggle=document.getElementById("voice-toggle");
  const stop=document.getElementById("stop-speaking");

  if(selector){
    selector.onchange=()=>{
      selectedVoiceURI=selector.value;
      saveSpeechPrefs();
      stopSpeaking();
    };
  }
  if(toggle)toggle.onclick=toggleSpeech;
  if(stop)stop.onclick=()=>{
    stopSpeaking();
    const status=document.getElementById("voice-status");
    if(status)status.textContent=voiceMode?"LISTENING FOR YOU":"STOPPED";
    if(voiceMode)queueListeningRestart();
  };

  refreshVoices();
  updateVoiceControls();

  // Some browsers load their voice list asynchronously.
  if(getSpeechEngine()){
    window.speechSynthesis.onvoiceschanged=refreshVoices;
  }
}

/* ===== CONTINUOUS VOICE CONVERSATION ===== */

function getRecognitionConstructor(){
  return window.SpeechRecognition || window.webkitSpeechRecognition || null;
}

function initRecognition(){
  const Recognition=getRecognitionConstructor();
  recognitionSupported=!!Recognition;
  if(!Recognition)return;
  recognition=new Recognition();
  recognition.lang="en-GB";
  recognition.continuous=true;
  recognition.interimResults=false;
  recognition.maxAlternatives=1;

  recognition.onresult=(event)=>{
    let transcript="";
    for(let i=event.resultIndex;i<event.results.length;i++){
      if(event.results[i].isFinal)transcript+=event.results[i][0].transcript+" ";
    }
    transcript=transcript.trim();
    if(transcript && voiceMode && !busy && !alexSpeaking){
      stopListening();
      const field=document.getElementById("chat-input");
      if(field)field.value=transcript;
      sendMessage(null,transcript);
    }
  };
  recognition.onerror=(event)=>{
    const status=document.getElementById("voice-status");
    if(event.error==="not-allowed" || event.error==="service-not-allowed"){
      voiceMode=false;
      updateMicButton("Microphone permission denied");
      return;
    }
    if(status && voiceMode)status.textContent="VOICE RECONNECTING";
  };
  recognition.onend=()=>{
    if(voiceMode && !busy && !alexSpeaking)queueListeningRestart();
  };
}

function startListening(){
  if(!voiceMode || !recognition || busy || alexSpeaking)return;
  try{
    recognition.start();
    updateMicButton("Listening — tap mic to stop");
  }catch(err){
    // The browser may still be shutting down its previous recognition session.
    queueListeningRestart();
  }
}

function stopListening(){
  if(restartRecognitionTimer){clearTimeout(restartRecognitionTimer);restartRecognitionTimer=null;}
  if(recognition){
    try{recognition.stop();}catch(err){}
  }
}

function queueListeningRestart(){
  if(!voiceMode)return;
  if(restartRecognitionTimer)clearTimeout(restartRecognitionTimer);
  restartRecognitionTimer=setTimeout(()=>{
    restartRecognitionTimer=null;
    startListening();
  },450);
}

function updateMicButton(message){
  const button=document.getElementById("mic-toggle");
  const status=document.getElementById("voice-status");
  if(button){
    button.classList.toggle("listening",voiceMode);
    button.textContent=voiceMode?"Mic: ON":"Mic";
    button.setAttribute("aria-pressed",String(voiceMode));
    button.title=voiceMode?"Listening is enabled. Tap to stop.":"Start continuous voice conversation";
  }
  if(status)status.textContent=message || (voiceMode?(alexSpeaking?"SPEAKING":"LISTENING FOR YOU"):(speechEnabled?"VOICE ON":"VOICE OFF"));
}

function toggleVoiceMode(){
  if(!recognitionSupported || !recognition){
    updateMicButton("Speech recognition isn't supported in this browser. Try Chrome or Edge on desktop.");
    return;
  }
  voiceMode=!voiceMode;
  if(voiceMode){
    // This click is the user gesture required by browsers to request microphone access.
    updateMicButton("Requesting microphone…");
    startListening();
  }else{
    stopListening();
    updateMicButton("Voice conversation stopped");
  }
}

/* ===== ACCOUNT SELECTION ===== */

function showAccounts(){
  voiceMode=false;
  stopListening();
  activeAccount=null;
  stopSpeaking();
  setHeader("A.L.E.X SYSTEM");

  const personal=accounts.map((a,i)=>`
    <button class="account" data-account="${i}">
      <div><strong>${escapeHTML(a.name)}</strong><small>Personal account</small></div>
      <span class="arrow">›</span>
    </button>`).join("");

  document.getElementById("screen").innerHTML=`
    <main class="center">
      ${intro()}
      <section class="card">
        <div class="eyebrow">Identity selection</div>
        <h2>Select account</h2>
        <p class="muted">Choose an account to continue.</p>
        <div class="account-list">
          <button class="account" id="owner-account">
            <div><strong>Billy</strong><small>Owner / administrator</small></div>
            <span class="arrow">›</span>
          </button>
          ${personal}
          <button class="account user-account" id="user-account">
            <div><strong>User</strong><small>Standard access</small></div>
            <span class="arrow">›</span>
          </button>
          <button id="add-account">＋ Add new account</button>
        </div>
        <div id="account-notice" class="notice"></div>
      </section>
      <footer>HOWARD CORE · A.L.E.X</footer>
    </main>`;

  document.getElementById("owner-account").onclick=()=>showLogin(OWNER.name,OWNER.pin,true);
  document.querySelectorAll("[data-account]").forEach(btn=>{
    btn.onclick=()=>{
      const a=accounts[Number(btn.dataset.account)];
      if(a)showLogin(a.name,a.pin,false);
    };
  });
  document.getElementById("user-account").onclick=()=>enterHUD("User",false);
  document.getElementById("add-account").onclick=showRegistration;
}

function showLogin(name,pin,isOwner){
  document.getElementById("screen").innerHTML=`
    <main class="center">${intro()}
      <section class="card">
        <div class="eyebrow">Authentication</div>
        <h2>Sign in · ${escapeHTML(name)}</h2>
        <form id="login-form" class="stack">
          <input id="login-pin" type="password" inputmode="numeric" placeholder="Enter PIN" required>
          <button type="submit">Sign in</button>
          <button type="button" id="back">Back to accounts</button>
        </form>
        <div id="login-notice" class="notice"></div>
      </section>
    </main>`;

  document.getElementById("back").onclick=showAccounts;
  document.getElementById("login-form").onsubmit=e=>{
    e.preventDefault();
    if(document.getElementById("login-pin").value===pin){
      enterHUD(name,isOwner);
    }else{
      document.getElementById("login-notice").textContent="Incorrect PIN.";
    }
  };
}

function showRegistration(){
  document.getElementById("screen").innerHTML=`
    <main class="center">${intro()}
      <section class="card">
        <div class="eyebrow">New identity</div><h2>Create account</h2>
        <p class="muted">Enter the registration code and choose a username and PIN.</p>
        <form id="register-form" class="stack">
          <input id="reg-code" type="password" inputmode="numeric" placeholder="Registration code" required>
          <input id="reg-name" maxlength="24" placeholder="Username" autocomplete="username" required>
          <input id="reg-pin" type="password" inputmode="numeric" minlength="4" maxlength="6" pattern="[0-9]{4,6}" placeholder="PIN (4–6 digits)" required>
          <input id="reg-confirm" type="password" inputmode="numeric" minlength="4" maxlength="6" pattern="[0-9]{4,6}" placeholder="Confirm PIN" required>
          <button type="submit">Create account</button>
          <button type="button" id="reg-cancel">Cancel</button>
        </form>
        <div id="reg-notice" class="notice"></div>
      </section>
    </main>`;

  document.getElementById("reg-cancel").onclick=showAccounts;
  document.getElementById("register-form").onsubmit=e=>{
    e.preventDefault();
    const code=document.getElementById("reg-code").value;
    const name=document.getElementById("reg-name").value.trim();
    const pin=document.getElementById("reg-pin").value;
    const confirm=document.getElementById("reg-confirm").value;
    const notice=document.getElementById("reg-notice");

    if(code!==REGISTRATION_CODE){notice.textContent="Incorrect registration code.";return;}
    if(!/^[0-9]{4,6}$/.test(pin)){notice.textContent="PIN must contain 4–6 digits.";return;}
    if(pin!==confirm){notice.textContent="PINs do not match.";return;}
    if(!name||["billy","user"].includes(name.toLowerCase())){
      notice.textContent="Choose another username.";return;
    }
    if(accounts.some(a=>a.name.toLowerCase()===name.toLowerCase())){
      notice.textContent="That username already exists.";return;
    }
    accounts.push({name,pin});
    try{saveAccounts();}catch(err){
      accounts.pop();notice.textContent="Could not save account in this browser.";return;
    }
    showAccounts();
  };
}

/* ===== HUD ===== */

function enterHUD(name,isOwner){
  activeAccount={name,isOwner};
  chatHistory=[];
  setHeader("SIGNED IN · "+name);

  document.getElementById("screen").innerHTML=`
    <main id="hud">
      <aside class="sidebar">
        <div class="eyebrow">Howard Core</div><h2>A.L.E.X</h2>
        <p class="muted">Signed in as<br><strong>${escapeHTML(name)}</strong></p>
        <button id="new-chat">＋ New conversation</button>
        <button id="sign-out">Sign out</button>
        <div style="margin-top:30px">
          <div class="eyebrow">System status</div>
          <p class="muted">Interface: <span style="color:var(--blue)">ONLINE</span></p>
          <p class="muted">Gemini: <span id="sidebar-ai">NOT CONNECTED</span></p>
          <p class="muted">Voice: <span id="voice-status">VOICE ON</span></p>
        </div>
      </aside>
      <section class="main-chat">
        <div class="hud-top">
          <div><strong>Personal Intelligence</strong>
            <div class="muted" id="subtitle">Ready when you are.</div>
          </div>
          <button class="mobile-only" id="mobile-out">Sign out</button>
          ${buildVoiceControls()}
          <div class="status" id="ai-status">STANDBY</div>
        </div>
        <div class="messages" id="messages">
          <div class="message ai">Hello, ${escapeHTML(name)}. I'm A.L.E.X. What are we working on?</div>
        </div>
        <form class="composer" id="chat-form">
          <input id="chat-input" placeholder="Message A.L.E.X..." autocomplete="off" required>
          <button type="button" id="mic-toggle" aria-label="Start continuous voice conversation" aria-pressed="false">Mic</button>
          <button id="send-button" type="submit">Send</button>
        </form>
        <div class="voice-hint" id="voice-hint">Tap Mic once for continuous conversation. Tap again to stop.</div>
      </section>
    </main>`;

  document.getElementById("sign-out").onclick=showAccounts;
  document.getElementById("mobile-out").onclick=showAccounts;

  document.getElementById("new-chat").onclick=()=>{
    chatHistory=[];
    stopSpeaking();
    document.getElementById("messages").innerHTML=
      '<div class="message ai">New conversation initiated. How can I help?</div>';
    document.getElementById("subtitle").textContent="New conversation";
    speakText("New conversation initiated. How can I help?");
  };

  document.getElementById("chat-form").onsubmit=sendMessage;
  const mic=document.getElementById("mic-toggle");
  if(mic)mic.onclick=toggleVoiceMode;
  initRecognition();
  if(!recognitionSupported){
    const hint=document.getElementById("voice-hint");
    if(hint)hint.textContent="Voice input may not be supported by this browser. Try Chrome or Edge on desktop; Safari support varies.";
    const button=document.getElementById("mic-toggle");
    if(button)button.title="Speech recognition is not supported in this browser";
  }
  attachVoiceControls();

  // Speak the greeting after the user has signed in.
  speakText(`Hello, ${name}. I'm A.L.E.X. What are we working on?`);
}

function addMessage(text,who){
  const node=document.createElement("div");
  node.className="message "+(who==="me"?"me":"ai");
  node.textContent=text;
  const messages=document.getElementById("messages");
  messages.appendChild(node);
  messages.scrollTop=messages.scrollHeight;
  return node;
}

function setAIStatus(s){
  const a=document.getElementById("ai-status");
  const b=document.getElementById("sidebar-ai");
  if(a)a.textContent=s;
  if(b)b.textContent=s;
}

/* ===== GEMINI ===== */

async function geminiRequest(contents,maxOutputTokens=1200){
  const key=GEMINI_API_KEY.trim();
  if(!key)throw new Error("No API key configured.");

  const url=`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${encodeURIComponent(key)}`;
  const response=await fetch(url,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      systemInstruction:{parts:[{text:
        "You are A.L.E.X, the Howard Core personal AI assistant. Be intelligent, capable, concise, friendly, and practical. Use a polished futuristic assistant style. Never call the user sir. Do not claim to control devices or access files unless an actual connected tool enables it."
      }]},
      contents,
      generationConfig:{temperature:0.8,maxOutputTokens}
    })
  });

  const data=await response.json();
  if(!response.ok)throw new Error(data?.error?.message||`HTTP ${response.status}`);
  return data;
}

async function sendMessage(event, overridePrompt){
  if(event)event.preventDefault();
  if(busy)return;

  const input=document.getElementById("chat-input");
  const prompt=(typeof overridePrompt==="string"?overridePrompt:input.value).trim();
  if(!prompt)return;

  if(!GEMINI_API_KEY.trim()){
    addMessage("Gemini isn't connected yet. Check the API key configured in alexindex.html.","ai");
    return;
  }

  if(voiceMode)stopListening();
  input.value="";
  addMessage(prompt,"me");
  chatHistory.push({role:"user",parts:[{text:prompt}]});
  busy=true;
  document.getElementById("send-button").disabled=true;
  input.disabled=true;
  setAIStatus("THINKING");

  try{
    const data=await geminiRequest(chatHistory);
    const answer=(data.candidates?.[0]?.content?.parts||[])
      .map(p=>p.text||"").join("").trim();
    if(!answer)throw new Error("Gemini returned no text. Try again.");

    chatHistory.push({role:"model",parts:[{text:answer}]});
    addMessage(answer,"ai");
    setAIStatus("ONLINE");
    speakText(answer);
  }catch(err){
    chatHistory.pop();
    addMessage("Connection error: "+err.message,"ai");
    setAIStatus("ERROR");
  }finally{
    busy=false;
    const send=document.getElementById("send-button");
    const field=document.getElementById("chat-input");
    if(send)send.disabled=false;
    if(field){field.disabled=false;if(!voiceMode)field.focus();}
    if(voiceMode && !alexSpeaking)queueListeningRestart();
  }
}

/* ===== STARTUP ===== */

loadSpeechPrefs();

if(getSpeechEngine()){
  refreshVoices();
  window.speechSynthesis.onvoiceschanged=refreshVoices;
}

showAccounts();
