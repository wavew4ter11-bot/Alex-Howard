<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#030711">
  <title>A.L.E.X — Howard Core</title>

  <style>
    :root {
      --bg: #030711;
      --panel: #06101f;
      --blue: #008cff;
      --cyan: #38eaff;
      --text: #e8f8ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 24px 16px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse at 50% 8%, #07345a 0%, transparent 52%),
        var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
    }

    main {
      width: min(100%, 640px);
      padding: clamp(24px, 5vw, 40px);
      border: 1px solid #087ab9;
      border-radius: 22px;
      background: #06101fee;
      box-shadow: 0 0 40px #0088ff20;
    }

    header {
      text-align: center;
      margin-bottom: 38px;
    }

    /* Holographic A.L.E.X orb */

    .orb-wrap {
      position: relative;
      width: 166px;
      height: 166px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      isolation: isolate;
    }

    .orb {
      position: relative;
      z-index: 2;
      width: 100px;
      height: 100px;
      display: grid;
      place-items: center;
      border: 1px solid #75f5ff;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 28%, #43dfff38, transparent 35%),
        radial-gradient(circle, #0a3e68 0%, #06172d 62%, #020713 100%);
      color: #d6fbff;
      font-size: 43px;
      font-weight: 300;
      text-shadow: 0 0 12px #00cfff, 0 0 26px #008cff;
      box-shadow:
        0 0 14px #00bfff99,
        0 0 34px #007bff44,
        inset 0 0 20px #00aaff44;
      animation: corePulse 4s ease-in-out infinite;
    }

    .ring {
      position: absolute;
      left: 50%;
      top: 50%;
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
    }

    .ring-one {
      width: 126px;
      height: 126px;
      border: 2px solid transparent;
      border-top-color: #47f4ff;
      border-right-color: #008cff;
      border-bottom-color: #0877c9;
      filter: drop-shadow(0 0 5px #00bfff);
      animation: rotateClockwise 12s linear infinite;
    }

    .ring-two {
      width: 145px;
      height: 145px;
      border: 1px solid transparent;
      border-left-color: #13baff;
      border-bottom-color: #1be8ff;
      opacity: .9;
      animation: rotateCounter 16s linear infinite;
    }

    .ring-three {
      width: 160px;
      height: 160px;
      border: 1px dashed #168fd6;
      opacity: .65;
      animation: rotateClockwise 35s linear infinite;
    }

    .ring-four {
      width: 116px;
      height: 116px;
      border: 1px solid #3beaff55;
      box-shadow: 0 0 12px #00bfff22;
    }

    .orbit-dot {
      position: absolute;
      z-index: 3;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #a8fbff;
      box-shadow: 0 0 8px #00dfff, 0 0 17px #008cff;
    }

    .dot-one {
      top: 17px;
      left: 40px;
    }

    .dot-two {
      right: 12px;
      bottom: 48px;
      width: 5px;
      height: 5px;
    }

    .dot-three {
      left: 24px;
      bottom: 35px;
      width: 4px;
      height: 4px;
    }

    h1 {
      margin: 0;
      color: var(--cyan);
      letter-spacing: .22em;
      font-size: clamp(30px, 7vw, 43px);
      text-shadow: 0 0 18px #00aaff77;
    }

    .subtitle {
      margin-top: 10px;
      color: #7796b3;
      font-size: 11px;
      letter-spacing: .22em;
    }

    .status {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-top: 17px;
      color: #70b6d6;
      font-size: 10px;
      letter-spacing: .16em;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #38eaff;
      box-shadow: 0 0 8px #00cfff;
    }

    h2 {
      margin-bottom: 8px;
      font-size: 20px;
    }

    .hint {
      margin-top: 0;
      margin-bottom: 20px;
      color: #91abc3;
      font-size: 14px;
    }

    #accounts {
      display: grid;
      gap: 12px;
    }

    button {
      width: 100%;
      min-height: 62px;
      padding: 14px 18px;
      border: 1px solid var(--blue);
      border-radius: 12px;
      background: #061b31;
      color: var(--cyan);
      font: inherit;
      text-align: left;
      cursor: pointer;
      box-shadow: 0 0 14px #00aaff22;
      touch-action: manipulation;
      transition: background .2s, box-shadow .2s;
    }

    button:hover,
    button:focus-visible {
      background: #073c61;
      outline: 2px solid var(--cyan);
      outline-offset: 2px;
      box-shadow: 0 0 20px #00aaff44;
    }

    .owner {
      background: #08213a;
    }

    .guest {
      border-color: #23618a;
    }

    .add {
      border-style: dashed;
      text-align: center;
    }

    #message {
      min-height: 24px;
      margin-top: 16px;
      color: var(--cyan);
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    footer {
      margin-top: 26px;
      padding-top: 16px;
      border-top: 1px solid #153047;
      color: #58758f;
      text-align: center;
      font-size: 10px;
      letter-spacing: .12em;
    }

    @keyframes rotateClockwise {
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    @keyframes rotateCounter {
      to { transform: translate(-50%, -50%) rotate(-360deg); }
    }

    @keyframes corePulse {
      0%, 100% {
        box-shadow: 0 0 14px #00bfff77,
                    0 0 30px #007bff33,
                    inset 0 0 18px #00aaff33;
      }
      50% {
        box-shadow: 0 0 24px #00dfffaa,
                    0 0 48px #007bff55,
                    inset 0 0 26px #00aaff66;
      }
    }

    @media (min-width: 700px) and (orientation: landscape) {
      #accounts {
        grid-template-columns: 1fr 1fr;
      }

      .add {
        grid-column: 1 / -1;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .ring,
      .orb {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <main>
    <header>
      <div class="orb-wrap" aria-label="A.L.E.X holographic orb">
        <div class="ring ring-three"></div>
        <div class="ring ring-two"></div>
        <div class="ring ring-one"></div>
        <div class="ring ring-four"></div>
        <div class="orb">A</div>
        <span class="orbit-dot dot-one"></span>
        <span class="orbit-dot dot-two"></span>
        <span class="orbit-dot dot-three"></span>
      </div>

      <h1>A.L.E.X</h1>
      <div class="subtitle">HOWARD CORE · ACCESS SYSTEM</div>

      <div class="status">
        <span class="status-dot"></span>
        INTERFACE ONLINE
      </div>
    </header>

    <section id="home">
      <h2>Select account</h2>
      <p class="hint">Choose an identity to continue.</p>
      <div id="accounts"></div>
      <div id="message" role="status" aria-live="polite"></div>
    </section>

    <footer>
      HOWARD CORE · PERSONAL ASSISTANT INTERFACE
    </footer>
  </main>

  <script>
    const accounts = [];

    function addAccount(name, detail, type) {
      const button = document.createElement("button");
      button.className = type;
      button.textContent = name + " — " + detail;
      button.addEventListener("click", () => selectAccount(name, type));
      document.getElementById("accounts").appendChild(button);
    }

    function selectAccount(name, type) {
      const message = document.getElementById("message");

      if (type === "add") {
        message.textContent = "Account registration will be added next.";
      } else if (type === "owner") {
        message.textContent = "Billy selected. Secure PIN login will be added next.";
      } else if (type === "user") {
        message.textContent = "Guest account selected.";
      } else {
        message.textContent = name + " selected.";
      }
    }

    addAccount("Billy", "OWNER", "owner");
    accounts.forEach(name => addAccount(name, "PERSONAL ACCOUNT", "guest"));
    addAccount("User", "GUEST ACCESS", "user");
    addAccount("+ Add new account", "REGISTER", "add");
  </script>
</body>
</html>
